<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Courbet Mine Complex | Earth Block Model</title>
<style>
html, body, #map { width:100%; height:100%; padding:0; margin:0; }
body { font-family: 'Work Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; }
#titlebar {
  position:absolute; top:0; left:0; right:0; z-index:1000;
  background:rgba(251,246,236,0.95); color:#2C2C2C;
  padding:10px 16px; border-bottom:2px solid #C9A84C;
  display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap;
}
#titlebar h1 { font-size:17px; margin:0; font-weight:600; }
#titlebar .sub { font-size:12px; color:#888888; }
.legend {
  background:rgba(255,255,255,0.95); padding:10px 12px; border-radius:6px;
  box-shadow:0 1px 5px rgba(0,0,0,0.3); font-size:12px; color:#2C2C2C; line-height:1.7;
}
.legend .sw { display:inline-block; width:12px; height:12px; margin-right:6px; vertical-align:-1px; border:1px solid #2C2C2C; }
.legend .note { color:#888888; font-size:10.5px; max-width:220px; line-height:1.4; margin-top:4px; }
.leaflet-popup-content { font-family:inherit; font-size:12.5px; color:#2C2C2C; line-height:1.55; margin:12px 14px; }
.leaflet-popup-content .bid { font-size:14px; font-weight:600; color:#A8893A; }
.leaflet-popup-content .k { color:#888888; }
.leaflet-container { background:#e8e4da; }
</style>
</head>
<body>
<div id="titlebar">
  <h1>Courbet Mine Complex &nbsp;|&nbsp; Earth Block Model</h1>
  <span class="sub">48,960 Earth Blocks &middot; 1.35 m cubes &middot; Esmeralda County, Nevada</span>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="surface_data.js"></script>
<script>
var map = L.map('map', { zoomControl:false, maxZoom:22, minZoom:12, preferCanvas:true });
L.control.zoom({ position:'topleft' }).addTo(map);
L.control.scale({ imperial:true, position:'bottomleft' }).addTo(map);

var terrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
  attribution:'Map data &copy; Google', maxNativeZoom:20, maxZoom:22 });
var satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  attribution:'Imagery &copy; Google', maxNativeZoom:20, maxZoom:22 });
satellite.addTo(map);

var GOLD='#C9A84C', DGOLD='#A8893A', GREEN='#4A7C59', CHAR='#2C2C2C';

var boundary = L.geoJson(json_PropertyBoundary, {
  interactive:false,
  style: function(f){ return f.properties.Name === 'Open pit'
    ? { color:'#FBF6EC', weight:1, dashArray:'2 4', fill:false, opacity:0.8 }
    : { color:'#FBF6EC', weight:2, dashArray:'6 4', fill:false, opacity:0.95 }; }
}).addTo(map);

function blockStyle(f){
  var vein = f.properties.s === 'vein';
  return { color: vein ? '#2f5038' : DGOLD, weight:0.4, opacity:0.9,
           fillColor: vein ? GREEN : GOLD, fillOpacity:0.92 };
}
function fmt(n){ return n.toLocaleString('en-US'); }
var blocks = L.geoJson(json_EarthBlocksSurface, {
  style: blockStyle,
  onEachFeature: function(f, layer){
    var p = f.properties;
    var depthFt = (p.d * 3.28084).toFixed(0);
    layer.bindPopup(
      '<div class="bid">' + p.b + '</div>' +
      '<span class="k">Provenance:</span> ' + p.p + '<br>' +
      '<span class="k">Claim:</span> ' + p.c + ' &nbsp; <span class="k">Source:</span> ' + p.s + '<br>' +
      '<span class="k">Feature:</span> ' + p.f + '<br>' +
      '<span class="k">Column:</span> ' + p.n + ' block' + (p.n>1?'s':'') +
      ' to ' + p.d.toFixed(2) + ' m (' + depthFt + ' ft) depth',
      { maxWidth: 280 });
  }
}).addTo(map);

map.fitBounds(blocks.getBounds().pad(0.06));

var legend = L.control({ position:'bottomright' });
legend.onAdd = function(){
  var div = L.DomUtil.create('div','legend');
  div.innerHTML =
    '<div><span class="sw" style="background:'+GOLD+'"></span>Dump material blocks (38,542)</div>' +
    '<div><span class="sw" style="background:'+GREEN+'"></span>Vein material blocks (10,418)</div>' +
    '<div><span class="sw" style="background:none;border:1.5px dashed #999"></span>Property boundary (123 ac)</div>' +
    '<div class="note">Map shows the surface layer of each block column; click any block for its column depth. ' +
    'Gold content is certified at the aggregate property level only; no individual block carries a stated gold content.</div>';
  return div;
};
legend.addTo(map);

L.control.layers({ 'Satellite':satellite, 'Terrain':terrain }, {
  'Earth Blocks':blocks, 'Property boundary':boundary }, { position:'topright' }).addTo(map);
</script>
</body>
</html>
